  <body>
    <!--
      THESIS: Every template is a case file, every client link a docket
      entry, every submission a stamped filing — never another dashboard
      card grid.
      OWN-WORLD: Ink-black masthead and folder-tab rail on bone paper; one
      committed stamp-red for the FILED mark and primary actions; IBM Plex
      Sans for prose, IBM Plex Mono for docket numbers, timestamps, and
      exhibit tags; ledger-ruled rows replace card grids.
      STORY: An admin registers, files a template, and issues one docket
      entry per client; the client opens their filing, completes it, and it
      locks — stamped.
      FIRST VIEWPORT: A docket register — masthead bar, left tab rail (Case
      Files / Docket / New Filing), ruled rows of case files with docket
      number, exhibit count, and a red or kraft status stamp at the row's
      edge.
      FORM: The Filing Room, direction 3 of 7 (courthouse filing index /
      docket), seed key c70dae2b.
      FINISH: unreviewed and undocumented is unfinished; this build ends
      with the finish review, the verdict, DESIGN.md, and every shipping
      raster carrying its provenance.
    -->
